name: check build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js設定
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install
        run: npm install
        working-directory: kokkofactory/frontend

      - name: build
        run: npm run build
        working-directory: kokkofactory/frontend